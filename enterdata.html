<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter Data - Crop Yield Predictor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #e8f5e9, #f1f8e9);
    }
    nav.navbar {
      background: rgba(34, 99, 47, 0.95);
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    }
    nav .nav-link {
      color: #fff !important;
      font-weight: 600;
      margin-right: 15px;
      transition: 0.3s;
    }
    nav .nav-link:hover {
      color: #ffeb3b !important;
    }
    .form-section {
      padding: 80px 20px;
    }
    .form-card {
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      padding: 40px;
      max-width: 850px;
      margin: auto;
    }
    h2.title {
      color: #2e7d32;
      font-weight: 700;
      text-align: center;
      margin-bottom: 25px;
    }
    p.subtitle {
      text-align: center;
      color: #555;
      font-size: 1.1rem;
      margin-bottom: 35px;
    }
    label {
      font-weight: 600;
      color: #388e3c;
    }
    input.form-control {
      border: 2px solid #c8e6c9;
      border-radius: 8px;
      transition: 0.3s;
    }
    input.form-control:focus {
      border-color: #43a047;
      box-shadow: 0 0 5px rgba(67,160,71,0.4);
    }
    .btn-main {
      background: #43a047;
      color: white;
      font-weight: 600;
      border-radius: 30px;
      border: none;
      padding: 10px 28px;
      transition: 0.3s;
    }
    .btn-main:hover {
      background: #66bb6a;
      transform: scale(1.05);
    }
    footer {
      background: #2e7d32;
      color: white;
      text-align: center;
      padding: 15px 0;
      font-size: 0.9rem;
      margin-top: 60px;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">🌾 Crop Yield Predictor</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="enterdata.html">Enter Data</a></li>
          <li class="nav-item"><a class="nav-link" href="results.html">View Results</a></li>
          <li class="nav-item"><a class="nav-link" href="help.html">Help</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Form Section -->
  <section class="form-section">
    <div class="form-card">
      <h2 class="title">Enter Your Field & Weather Data</h2>
      <p class="subtitle">Provide accurate soil and environmental values to predict your expected crop yield.</p>
      
      <form id="dataForm" class="row g-4">
        <div class="col-md-4">
          <label for="nitrogen">Nitrogen (N)</label>
          <input type="number" id="nitrogen" class="form-control" placeholder="e.g. 80" required>
        </div>
        <div class="col-md-4">
          <label for="phosphorus">Phosphorus (P)</label>
          <input type="number" id="phosphorus" class="form-control" placeholder="e.g. 45" required>
        </div>
        <div class="col-md-4">
          <label for="potassium">Potassium (K)</label>
          <input type="number" id="potassium" class="form-control" placeholder="e.g. 40" required>
        </div>

        <div class="col-md-4">
          <label for="temperature">Temperature (°C)</label>
          <input type="number" id="temperature" class="form-control" placeholder="e.g. 28" required>
        </div>
        <div class="col-md-4">
          <label for="humidity">Humidity (%)</label>
          <input type="number" id="humidity" class="form-control" placeholder="e.g. 75" required>
        </div>
        <div class="col-md-4">
          <label for="rainfall">Rainfall (mm)</label>
          <input type="number" id="rainfall" class="form-control" placeholder="e.g. 180" required>
        </div>

        <div class="col-md-4">
          <label for="ph">Soil pH</label>
          <input type="number" step="0.1" id="ph" class="form-control" placeholder="e.g. 6.5" required>
        </div>
        <div class="col-md-4">
          <label for="crop">Crop Type</label>
          <input type="text" id="crop" class="form-control" placeholder="e.g. Rice, Wheat" required>
        </div>
        <div class="col-md-4">
          <label for="region">Region</label>
          <input type="text" id="region" class="form-control" placeholder="e.g. Andhra Pradesh" required>
        </div>

        <div class="col-12 text-center mt-4">
            <div class="col-md-4">
  <label for="area">Area (in acres)</label>
  <input type="number" id="area" class="form-control" placeholder="e.g. 2" required>
</div>

<div class="col-12 text-center mt-4">
          <button type="submit" class="btn-main">Predict Yield</button>
        </div>
      </form>
    </div>
  </section>

  <footer>
    © 2025 Crop Yield Predictor | Designed for Smart Agriculture 🌾
  </footer>

 <script>
  document.getElementById('dataForm').addEventListener('submit', function(e){
    e.preventDefault();

    // Collect form data
    const formData = {
      nitrogen: document.getElementById('nitrogen').value,
      phosphorus: document.getElementById('phosphorus').value,
      potassium: document.getElementById('potassium').value,
      temperature: document.getElementById('temperature').value,
      humidity: document.getElementById('humidity').value,
      rainfall: document.getElementById('rainfall').value,
      ph: document.getElementById('ph').value,
      crop: document.getElementById('crop').value,
      region: document.getElementById('region').value,
      area: document.getElementById('area').value  // ✅ newly added
    };

    // Store in localStorage
    localStorage.setItem('cropData', JSON.stringify(formData));

    // Redirect to Results Page
    window.location.href = "results.html";
  });
</script>
